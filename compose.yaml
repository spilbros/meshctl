services:
  headscale:
    image: headscale/headscale:0.29.1
    restart: unless-stopped
    networks: [meshnet]
    command: serve
    # headscale reads HEADSCALE_* env vars as config overrides; these
    # two are fed from .env so the domain lives in one place.
    environment:
      HEADSCALE_SERVER_URL: https://${MESH_DOMAIN:?set MESH_DOMAIN in .env (cp .env.example .env)}
      HEADSCALE_DNS_BASE_DOMAIN: ${MESH_BASE_DOMAIN:-home.arpa}
    healthcheck:
        test: ["CMD", "headscale", "health"]
    volumes:
      - ./headscale/config.yaml:/etc/headscale/config.yaml:ro
      - ./headscale/acl.yml:/etc/headscale/acl.yml:ro
      - headscale_data:/var/lib/headscale

  caddy:
    image: caddy:2.11.4
    restart: unless-stopped
    networks: [meshnet]
    depends_on: [headscale]
    environment:
      MESH_DOMAIN: ${MESH_DOMAIN:?set MESH_DOMAIN in .env (cp .env.example .env)}
    ports:
      - "${MESH_HTTP_PORT:-80}:80"
      - "${MESH_HTTPS_PORT:-443}:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config


networks:
  meshnet:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  headscale_data:

